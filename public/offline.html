<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Familienkalender</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f3c896; color: #3b1f0a; text-align: center; padding: 24px; box-sizing: border-box; }
    img { width: 120px; height: 120px; border-radius: 26px; box-shadow: 0 8px 24px rgba(80, 40, 10, .25); }
    h1 { font-size: 1.3rem; margin: 20px 0 8px; }
    p { margin: 0 0 20px; opacity: .8; }
    button { font: inherit; font-weight: 600; padding: 12px 22px; border-radius: 14px; border: 0; background: #7a3d12; color: #fff; }
  </style>
</head>
<body>
  <div>
    <img src="icon-192.png" alt="" />
    <h1>Keine Verbindung</h1>
    <p>Beim ersten Start braucht der Familienkalender Internet.<br />Danach funktioniert er auch offline.</p>
    <button onclick="location.href='https://familienkalender-baf.pages.dev/'">Nochmal versuchen</button>
  </div>
</body>
</html>
