name: Erinnerungsdienst einrichten (Cloudflare)

# Richtet den Cloudflare Worker ein bzw. aktualisiert ihn.
# Benötigte Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID (dazu die vorhandenen FAMILY_ID, NTFY_TOKEN).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['reminders/**', 'src/lib/**', 'src/types.ts']

permissions:
  contents: read

concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FAMILY_ID: ${{ secrets.FAMILY_ID }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
    steps:
      - name: Secrets prüfen
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID fehlen – Cloudflare noch nicht eingerichtet."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.ready == 'true'
      - name: Firebase-Werte lesen und Zugang erzeugen
        if: steps.check.outputs.ready == 'true'
        id: fb
        run: |
          CFG=$(grep '^VITE_FIREBASE_CONFIG=' .env.production | cut -d= -f2-)
          KEY=$(node -e "console.log(JSON.parse(process.argv[1]).apiKey)" "$CFG")
          PID=$(node -e "console.log(JSON.parse(process.argv[1]).projectId)" "$CFG")
          RT=$(curl -sf -X POST "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$KEY" -H 'content-type: application/json' -d '{"returnSecureToken":true}' | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).refreshToken))")
          echo "::add-mask::$RT"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"
          echo "pid=$PID" >> "$GITHUB_OUTPUT"
          echo "rt=$RT" >> "$GITHUB_OUTPUT"
      - name: Worker hochladen
        if: steps.check.outputs.ready == 'true'
        working-directory: reminders
        run: |
          npx --yes wrangler@4 deploy --var FIREBASE_API_KEY:${{ steps.fb.outputs.key }} --var FIREBASE_PROJECT_ID:${{ steps.fb.outputs.pid }} 2>&1 | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' /tmp/deploy.log | head -1)
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
      - name: Eigene Adresse für den Dienst (ohne Kontonamen), falls die Domain bei Cloudflare liegt
        if: steps.check.outputs.ready == 'true' && env.WORKER_URL != ''
        run: |
          DOMAIN=$(sed 's/^[^.]*\.//' public/CNAME | tr -d '[:space:]')
          HOST="erinnerungen.$DOMAIN"
          API=https://api.cloudflare.com/client/v4
          ZONES=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API/zones?name=$DOMAIN")
          ZONE=$(echo "$ZONES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.result?.[0]?.id??'')}catch{console.log('')}})")
          if [ -z "$ZONE" ]; then
            echo "::notice::$DOMAIN liegt nicht in diesem Cloudflare-Konto (oder dem Token fehlt die Berechtigung) – der Dienst bleibt unter workers.dev erreichbar."
            echo "$ZONES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log('Antwort:',j.success,(j.errors||[]).map(e=>e.code+' '+e.message).join('; '))}catch{console.log('keine JSON-Antwort')}})"
            exit 0
          fi
          R=$(curl -s -X PUT "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'content-type: application/json' \
            -d "{\"hostname\":\"$HOST\",\"service\":\"familienkalender-erinnerungen\",\"zone_id\":\"$ZONE\",\"environment\":\"production\"}")
          OK=$(echo "$R" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const j=JSON.parse(s);console.log(j.success?'yes':'no '+(j.errors||[]).map(e=>e.code+' '+e.message).join('; '))}catch{console.log('no')}})")
          echo "Eigene Adresse $HOST: $OK"
          if [ "$OK" = "yes" ]; then
            for i in $(seq 1 30); do curl -sf -o /dev/null "https://$HOST/" && break; sleep 10; done
            if curl -sf -o /dev/null "https://$HOST/"; then echo "WORKER_URL=https://$HOST" >> "$GITHUB_ENV"; echo "✓ Dienst unter https://$HOST erreichbar"; fi
          fi
      - name: Adresse des Dienstes für den Abo-Link hinterlegen
        if: steps.check.outputs.ready == 'true' && env.WORKER_URL != ''
        env:
          KEY: ${{ steps.fb.outputs.key }}
          PID: ${{ steps.fb.outputs.pid }}
          RT: ${{ steps.fb.outputs.rt }}
        run: |
          FID=$(echo -n "$FAMILY_ID" | tr -d '[:space:]')
          IDT=$(curl -sf -X POST "https://securetoken.googleapis.com/v1/token?key=$KEY" -d "grant_type=refresh_token&refresh_token=$RT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).id_token))")
          curl -sf -o /dev/null -X PATCH "https://firestore.googleapis.com/v1/projects/$PID/databases/(default)/documents/families/$FID/meta/service" \
            -H "Authorization: Bearer $IDT" -H 'content-type: application/json' \
            -d "{\"fields\":{\"url\":{\"stringValue\":\"$WORKER_URL\"}}}"
          echo "Adresse hinterlegt."
      - name: Secrets im Worker setzen
        if: steps.check.outputs.ready == 'true'
        working-directory: reminders
        env:
          RT: ${{ steps.fb.outputs.rt }}
        run: |
          # Verzeichnis weiterer Familien: geheimer Pfad, einmalig zufällig erzeugt, liegt nur in Cloudflare
          # (nie überschreiben – schlägt die Abfrage fehl, lieber abbrechen)
          LIST=$(npx --yes wrangler@4 secret list --format json)
          if echo "$LIST" | grep -q '"REGISTRY_ID"'; then
            export REGISTRY_ID=""
          else
            export REGISTRY_ID=$(node -e "const a='abcdefghijkmnpqrstuvwxyz23456789';console.log([...crypto.getRandomValues(new Uint8Array(32))].map(b=>a[b%32]).join(''))")
            echo "::add-mask::$REGISTRY_ID"
            echo "Verzeichnis für weitere Familien wird angelegt."
          fi
          node -e "const o={FAMILY_ID:process.env.FAMILY_ID.trim(),NTFY_TOKEN:process.env.NTFY_TOKEN.trim(),FIREBASE_REFRESH_TOKEN:process.env.RT};if(process.env.REGISTRY_ID)o.REGISTRY_ID=process.env.REGISTRY_ID;console.log(JSON.stringify(o))" > /tmp/secrets.json
          npx --yes wrangler@4 secret bulk /tmp/secrets.json
          rm /tmp/secrets.json
          echo "SINCE=$(date +%s%3N)" >> "$GITHUB_ENV"
      - name: Prüfen, ob Cloudflare läuft (bis zu 8 Minuten)
        if: steps.check.outputs.ready == 'true'
        run: |
          npx esbuild reminders/verify.ts --bundle --platform=node --format=esm --outfile=.reminder-build/verify.mjs --log-level=warning
          node .reminder-build/verify.mjs
