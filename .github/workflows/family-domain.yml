name: Domain einer Familie verwalten

# Nur von dir zu starten (Actions → „Domain einer Familie verwalten“ → Run workflow).
# Hängt die Domain einer anderen Familie an die gemeinsame App (Cloudflare Pages „familienkalender“)
# bzw. entfernt sie wieder. Die Familie legt bei ihrem Domain-Anbieter einen CNAME auf die
# öffentliche Adresse an – die genaue Angabe steht nach dem Lauf in der Zusammenfassung.
on:
  workflow_dispatch:
    inputs:
      aktion:
        description: 'Was soll passieren?'
        type: choice
        options: [hinzufügen, anzeigen, entfernen]
        default: hinzufügen
      domain:
        description: 'Domain der Familie, z. B. kalender.mueller.at (bei „anzeigen“ leer lassen = alle)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: family-domain
  cancel-in-progress: false

jobs:
  domain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AKTION: ${{ inputs.aktion }}
      DOMAIN_IN: ${{ inputs.domain }}
      PROJECT: familienkalender
    steps:
      - name: Prüfen und ausführen
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID fehlen"; exit 1; fi
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT"
          AUTH=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "content-type: application/json")
          DOMAIN=$(printf %s "$DOMAIN_IN" | tr 'A-Z' 'a-z' | tr -d '[:space:]' | sed -e 's#^https\?://##' -e 's#/.*$##')
          TARGET=$(curl -s "${AUTH[@]}" "$API" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.result?.subdomain||'')})")
          [ -n "$TARGET" ] || { echo "::error::Pages-Projekt $PROJECT nicht gefunden"; exit 1; }
          show() { node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.log('Fehler: '+(j.errors||[]).map(e=>e.code+' '+e.message).join('; '));process.exit(1)}const r=[].concat(j.result||[]);for(const d of r)console.log('- '+d.name+': '+d.status+(d.validation_data?.status?' (Prüfung: '+d.validation_data.status+')':'')+(d.verification_data?.error_message?' – '+d.verification_data.error_message:''));if(!r.length)console.log('(keine)')})"; }
          case "$AKTION" in
            anzeigen)
              echo "## Domains der gemeinsamen App" >> "$GITHUB_STEP_SUMMARY"
              curl -s "${AUTH[@]}" "$API/domains" | show | tee -a "$GITHUB_STEP_SUMMARY" ;;
            hinzufügen|entfernen)
              if ! printf %s "$DOMAIN" | grep -Eq '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,}$'; then echo "::error::„$DOMAIN_IN“ ist keine gültige Domain"; exit 1; fi
              case "$DOMAIN" in *chaoten.online|*.pages.dev|*.workers.dev) echo "::error::Diese Domain ist reserviert"; exit 1;; esac
              if [ "$AKTION" = "hinzufügen" ]; then
                curl -s -X POST "${AUTH[@]}" "$API/domains" -d "{\"name\":\"$DOMAIN\"}" | show
                {
                  echo "## $DOMAIN hinzugefügt"
                  echo
                  echo "Die Familie legt bei ihrem Domain-Anbieter diesen DNS-Eintrag an:"
                  echo
                  echo "| Typ | Name | Ziel |"
                  echo "|---|---|---|"
                  echo "| CNAME | \`$DOMAIN\` | \`$TARGET\` |"
                  echo
                  echo "Danach dauert es meist wenige Minuten bis zu einer Stunde (Zertifikat). Stand prüfen: diesen Workflow mit „anzeigen“ starten."
                } >> "$GITHUB_STEP_SUMMARY"
              else
                curl -s -X DELETE "${AUTH[@]}" "$API/domains/$DOMAIN" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);console.log(j.success?'entfernt':'Fehler: '+(j.errors||[]).map(e=>e.code+' '+e.message).join('; '));if(!j.success)process.exit(1)})"
                echo "## $DOMAIN entfernt" >> "$GITHUB_STEP_SUMMARY"
              fi ;;
          esac
