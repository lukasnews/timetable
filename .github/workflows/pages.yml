name: Veröffentlichen

# Bei jeder Änderung auf main: testen, bauen und auf Cloudflare Pages veröffentlichen
# (Projekt „familienkalender“ – alle Familien, eigene Domains werden dort angehängt).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Testen, bauen, auf Cloudflare Pages veröffentlichen (ein Job – spart Actions-Minuten)
  public:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets prüfen
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then echo "ready=false" >> "$GITHUB_OUTPUT"; else echo "ready=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm test && npm run build
      - name: Auf Cloudflare Pages veröffentlichen
        if: steps.check.outputs.ready == 'true'
        run: |
          set -o pipefail
          rm -f dist/CNAME
          npx --yes wrangler@4 pages project create familienkalender --production-branch=main 2>&1 | tail -3 || true
          npx --yes wrangler@4 pages deploy dist --project-name=familienkalender --branch=main --commit-dirty=true 2>&1 | tee /tmp/pages.log
          echo "Öffentliche Adresse: https://$(npx --yes wrangler@4 pages project list 2>/dev/null | grep -oE 'familienkalender[a-z0-9-]*\.pages\.dev' | head -1)"
