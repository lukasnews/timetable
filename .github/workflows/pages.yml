name: Veröffentlichen

# Bei jeder Änderung auf main: testen, bauen und das Ergebnis nach docs/ auf main committen.
# GitHub Pages zeigt main /docs an (Settings → Pages → Deploy from a branch → main, /docs).
# Commits mit dem GITHUB_TOKEN starten keinen neuen Lauf, es entsteht also keine Schleife.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Nach docs/ kopieren und committen
        run: |
          rm -rf docs
          cp -r dist docs
          touch docs/.nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "Keine Änderungen an der gebauten App."
          else
            git commit -m "Build: App nach docs/ aktualisiert"
            git push
          fi
